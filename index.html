<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Royee Chu">
<title>Royee Chu</title>
<meta name="description" content="Royee Chu 的個人網站">
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #6d4aff;
    --card: #f6f5ff;
    --line: #e4e1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14131a;
      --text: #ececf1;
      --muted: #9b9aa8;
      --accent: #a58bff;
      --card: #1e1c29;
      --line: #2e2b40;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Avenir Next", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    line-height: 1.75;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  nav { border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; }
  nav a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 15px; }
  nav a:hover { color: var(--accent); }
  nav .brand { color: var(--text); font-weight: 700; margin: 0; }
  header { padding: 80px 0 56px; }
  header h1 { font-size: clamp(34px, 7vw, 52px); line-height: 1.2; margin: 0 0 16px; }
  header h1 span { color: var(--accent); }
  header p { font-size: 18px; color: var(--muted); margin: 0; max-width: 560px; }
  section { padding: 40px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 24px; margin: 0 0 20px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card h3 { margin: 0 0 8px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  a.link { color: var(--accent); }
  footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="#">Royee Chu</a>
    <div>
      <a href="#about">關於我</a>
      <a href="#projects">作品</a>
      <a href="#contact">聯絡</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <header>
    <h1>你好，我是 <span>Royee</span></h1>
    <p>這裡放一句話介紹自己，例如你在做什麼、關心什麼。</p>
  </header>

  <section id="about">
    <h2>關於我</h2>
    <p>在這裡寫一段自我介紹：你的背景、現在在做的事、興趣，三到五句就夠了。</p>
  </section>

  <section id="projects">
    <h2>作品</h2>
    <div class="grid">
      <div class="card">
        <h3>作品一</h3>
        <p>用一兩句話說明這個作品是什麼、你做了哪些部分。</p>
      </div>
      <div class="card">
        <h3>作品二</h3>
        <p>用一兩句話說明這個作品是什麼、你做了哪些部分。</p>
      </div>
      <div class="card">
        <h3>作品三</h3>
        <p>用一兩句話說明這個作品是什麼、你做了哪些部分。</p>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>聯絡</h2>
    <p>想聯絡我，可以寄信到 <a class="link" href="mailto:your@email.com">your@email.com</a>。</p>
  </section>
</main>

<footer>
  <div class="wrap">© 2026 Royee Chu</div>
</footer>

</body>
</html>
